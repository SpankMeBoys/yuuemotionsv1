:root{color-scheme:dark;--gold:#cfb37c;--ink:#2b211e;--paper:#dfcba9;--night:#0a090d}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 23%,#28202a 0%,#111017 49%,#08080c 100%);color:#f3e6cf;font-family:Georgia,serif}button{font:inherit;cursor:pointer}.topbar{max-width:1190px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:19px 24px 4px;gap:12px}.brand{font:600 22px 'Cormorant Garamond',Georgia,serif;letter-spacing:.08em;color:#edd8b5}.topbar small{font:12px Georgia,serif;color:#b8a995}.topbar button{border:1px solid #655643;border-radius:999px;padding:8px 13px;background:#1c1720;color:#f1dabb}.scene{perspective:1900px;max-width:1160px;margin:0 auto;padding:28px 26px 10px}.book{position:relative;width:100%;height:min(72vh,720px);min-height:530px;display:grid;grid-template-columns:1fr 1fr;filter:drop-shadow(0 25px 33px rgba(0,0,0,.7));transform-style:preserve-3d}.book::before{content:'';position:absolute;inset:-8px -9px -13px;background:#4c3028;border:1px solid #7f6048;border-radius:10px 18px 18px 10px;z-index:-2;box-shadow:0 0 0 3px #1c1416}.book::after{content:'';position:absolute;top:0;bottom:0;left:calc(50% - 13px);width:26px;z-index:3;pointer-events:none;background:linear-gradient(90deg,rgba(33,21,18,.34),rgba(255,246,215,.2) 35%,rgba(40,27,22,.18) 63%,transparent)}.page{position:relative;overflow:hidden;color:#362921;padding:clamp(24px,3.4vw,45px);background:repeating-linear-gradient(0deg,transparent 0 28px,rgba(83,59,35,.016) 29px),radial-gradient(ellipse at 42% 39%,#efdfc0 0%,#ddc7a4 64%,#bea27d 100%);box-shadow:inset 0 0 55px rgba(95,65,37,.11);border:1px solid #a98d68}.page.left{border-radius:8px 0 0 8px;border-right:0}.page.right{border-radius:0 9px 9px 0;border-left:0}.page::before{content:'';position:absolute;inset:17px;border:1px solid rgba(110,73,40,.18);pointer-events:none}.page.left::after{content:'';position:absolute;top:0;right:0;bottom:0;width:45px;background:linear-gradient(90deg,transparent,rgba(53,35,26,.17));pointer-events:none}.page.right::after{content:'';position:absolute;top:0;left:0;bottom:0;width:38px;background:linear-gradient(90deg,rgba(53,35,26,.18),transparent);pointer-events:none}.page-inner{height:100%;display:flex;flex-direction:column;position:relative;z-index:1}.kicker{font:11px Marcellus,Georgia,serif;text-transform:uppercase;letter-spacing:.18em;color:#7a5840}.pagenum{margin-top:auto;text-align:center;font:12px Marcellus,serif;color:#8b6b4c;padding-top:15px}.rule{width:80px;height:1px;background:#a87b57;margin:16px 0}.page h1,.page h2{font-family:'Cormorant Garamond',Georgia,serif;line-height:1.05;font-weight:600;margin:12px 0 6px}.page h1{font-size:clamp(46px,6vw,82px)}.page h2{font-size:clamp(31px,3.8vw,55px)}.page h3{font-family:'Cormorant Garamond',Georgia,serif;margin:0 0 17px;font-weight:500;font-size:clamp(22px,2.6vw,32px);color:#815639}.page p{font-size:clamp(13px,1.35vw,17px);line-height:1.65;margin:0 0 13px}.page .facts{padding-left:18px;margin:8px 0 0}.page li{font-size:clamp(12px,1.17vw,15px);line-height:1.55;margin:0 0 6px}.cover-page{color:#e8d1a6;background:radial-gradient(circle at 50% 38%,#422f35,#1c151c 52%,#120f17 100%);border-color:#785d3b;text-align:center}.cover-page::before{inset:19px;border:2px double rgba(215,174,106,.55)}.cover-page .page-inner{align-items:center;justify-content:center}.cover-page .kicker,.cover-page .pagenum{color:#cfb37c}.cover-page h1{font-size:clamp(50px,6.2vw,90px);letter-spacing:.035em}.cover-page h3{color:#dcb780}.cover-sigil{font-size:65px;line-height:1;color:#cfa86d;text-shadow:0 0 25px #8f464f;margin-bottom:14px}.cover-page p{max-width:300px;color:#d3bfa2}.art{position:relative;height:clamp(140px,23vh,220px);display:flex;align-items:center;justify-content:center;margin:3px 0 18px;border-radius:100px 100px 15px 15px;background:radial-gradient(ellipse at 50% 82%,color-mix(in srgb,var(--aura) 24%,transparent),transparent 66%);overflow:hidden}.flame{position:absolute;bottom:0;width:75px;height:150px;border-radius:45% 45% 30% 30% / 70% 70% 30% 30%;background:radial-gradient(ellipse at 50% 90%,#fff3c9 0%,var(--aura) 28%,color-mix(in srgb,var(--aura) 45%,transparent) 63%,transparent 77%);filter:blur(7px);transform-origin:center bottom;animation:flicker 2.5s ease-in-out infinite alternate}.flame:nth-child(2){height:115px;width:65px;left:34%;animation-delay:-.7s}.flame:nth-child(3){height:95px;width:55px;left:58%;animation-delay:-1.3s}.flame:nth-child(4){height:180px;width:85px;left:42%;animation-delay:-1.8s}.art[data-emotion=haine] .flame{background:radial-gradient(ellipse at 50% 88%,#555 0%,#09080a 36%,#5c5460 70%,transparent 82%);filter:drop-shadow(0 0 9px #302e34) blur(5px)}@keyframes flicker{from{transform:scale(.9,1) rotate(-8deg);opacity:.77}to{transform:scale(1.13,.86) rotate(7deg);opacity:1}}.under-art{text-align:center;font-family:'Cormorant Garamond',serif;font-size:19px;color:#795b47}.controls{display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap;padding:14px 20px 28px}.controls button{background:#251d23;color:#f5dfbd;border:1px solid #85704e;border-radius:12px;padding:11px 21px;min-width:155px}.controls button:disabled{opacity:.35;cursor:not-allowed}.controls span{min-width:110px;text-align:center;color:#c7ac85;font:14px Marcellus,Georgia,serif}.hint{text-align:center;color:#9f8d77;font-size:12px;padding:0 10px 18px}.turn-overlay{position:absolute;top:0;bottom:0;width:50%;z-index:12;transform-style:preserve-3d;pointer-events:none;display:none}.turn-overlay.next{left:50%;transform-origin:left center}.turn-overlay.prev{left:0;transform-origin:right center}.turn-overlay.active{display:block;animation:turnNext .78s cubic-bezier(.24,.5,.5,1) forwards}.turn-overlay.prev.active{animation-name:turnPrev}.turn-face{position:absolute;inset:0;backface-visibility:hidden;overflow:hidden}.turn-front{background:linear-gradient(90deg,#d9c19c,#ebdcba 64%,#c9ad86);box-shadow:inset 15px 0 30px #80684a55,7px 0 26px #0005}.turn-back{transform:rotateY(180deg);background:linear-gradient(90deg,#e3d1ae,#d4b991 88%);box-shadow:inset -13px 0 28px #80684a55}.turn-face .turn-ornament{position:absolute;inset:20px;border:1px solid #97765377;display:grid;place-items:center;text-align:center;color:#977653;font:italic 34px 'Cormorant Garamond',serif;padding:25px}.turn-face .turn-ornament small{display:block;font-size:16px}.turn-overlay.prev .turn-front{transform:rotateY(180deg)}.turn-overlay.prev .turn-back{transform:rotateY(0)}@keyframes turnNext{from{transform:rotateY(0)}to{transform:rotateY(-180deg)}}@keyframes turnPrev{from{transform:rotateY(0)}to{transform:rotateY(180deg)}}.glow-orbs{font-size:38px;letter-spacing:11px;filter:drop-shadow(0 0 8px #d0a55d)}.vignette{font-style:italic;color:#7a4f48!important;font-size:clamp(16px,1.9vw,22px)!important}.page.backcover .page-inner{justify-content:center;text-align:center}.page.backcover{background:radial-gradient(ellipse at center,#422f35,#18131a);color:#e5d0af}.page.backcover h2{color:#e6c58c}.page.backcover p{color:#e8d8c2}.page.backcover .pagenum{color:#c8a77b}@media(max-width:750px){.topbar{padding:12px 14px}.topbar small{display:none}.scene{padding:15px 11px 3px}.book{height:min(74vh,690px);min-height:560px;display:block}.page{position:absolute;inset:0;padding:27px 27px}.page.left{display:none}.page.right{border:1px solid #a98d68;border-radius:6px}.book::after{display:none}.turn-overlay.next,.turn-overlay.prev{left:0;width:100%;transform-origin:left center}.turn-overlay.prev{transform-origin:right center}.page h2{font-size:36px}.page p{font-size:14.5px}.page li{font-size:13px}.art{height:155px;margin:4px 0 15px}.controls{gap:9px}.controls button{min-width:120px;padding:10px 12px}.controls span{min-width:70px}.book::before{inset:-5px -7px -9px}}@media(max-height:730px){.book{min-height:510px}.page p{line-height:1.5;margin-bottom:8px}.page li{line-height:1.42}.art{height:140px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@media print{body{background:#fff;color:#111}.topbar,.controls,.hint,.turn-overlay{display:none!important}.scene{padding:0}.book{display:block;height:auto;filter:none}.page{position:relative!important;display:block!important;break-after:page;height:250mm;width:180mm;border:1px solid #ccc;margin:auto}.book::before,.book::after{display:none}}
</style></head><body>
<header class="topbar"><div class="brand">✦ LES ÉMOTIONS <small>· Grimoire des flammes</small></div><button id="contents">☷ Sommaire</button></header>
<main class="scene"><div class="book" id="book" aria-live="polite"><article class="page left" id="left"></article><article class="page right" id="right"></article><div class="turn-overlay next" id="turn"><div class="turn-face turn-front"><div class="turn-ornament">✧<small>Les émotions</small></div></div><div class="turn-face turn-back"><div class="turn-ornament">❦<small>Archives interdites</small></div></div></div></div></main>
<div class="controls"><button id="prev" aria-label="Tourner la page précédente">← Précédent</button><span id="counter"></span><button id="next" aria-label="Tourner la page suivante">Suivant →</button></div><div class="hint">Cliquez sur les flèches ou utilisez les touches ← → du clavier · Touchez/glissez horizontalement sur mobile</div>
<script>
const pages=[{"id": "couverture", "type": "cover", "title": "Les Émotions", "subtitle": "Le grimoire des flammes de l’âme", "paras": ["Archives interdites de Gekko", "Un héritage transmis à Yuu, sa fille adoptive."], "facts": []}, {"id": "preface", "title": "Un feu né des blessures de l'âme", "subtitle": "Archives interdites", "paras": ["Il existe des pouvoirs nés de l'entraînement, d'autres du sang, et certains... d'une blessure trop profonde pour être refermée. Les Émotions ne sont ni un simple art, ni une simple malédiction. Elles sont un héritage vivant , façonné par Gekko, dont le cœur rongé par les ténèbres donna naissance à des flammes alimentées non par le bois, ni par l'huile, mais par les sentiments eux-mêmes.", "La tristesse consume lentement. La colère éclate. La haine souille. L'obsession enchaîne. La peur paralyse. Le désespoir vide l'être jusqu'au silence."], "facts": [], "type": "chapter"}, {"id": "tristesse", "title": "Le Bleu · La Tristesse", "subtitle": "La flamme qui épuise sans éclater", "paras": ["La tristesse se manifeste sous la forme d'une flamme bleue, vacillante, douce en apparence, mais terriblement persistante. Elle ne brûle pas avec violence ; elle consume avec lenteur.", "Le bleu de cette émotion est celui du silence après le deuil, des larmes retenues jusqu'au tremblement, et des blessures qui continuent de vivre à l'intérieur de l'âme."], "facts": ["Couleur : bleu froid et liquide", "Forme : flammes lentes, souples, presque aqueuses", "Effet : affaiblissement, lourdeur du souffle, fatigue émotionnelle"], "type": "emotion"}, {"id": "colere", "title": "Le Rouge · La Colère", "subtitle": "La flamme qui explose", "paras": ["La colère prend vie à travers une flamme rouge, vive, instable et brutale. Elle surgit comme une déchirure. Là où la tristesse use lentement, la colère dévore tout en un instant.", "Le rouge est ici celui du sang qui bat trop fort, de la rage contenue trop longtemps et du cri qui finit par faire éclater le silence."], "facts": ["Couleur : rouge vif, incandescent", "Forme : gerbes irrégulières, pulsations agressives", "Effet : puissance, impulsion, violence... mais aussi autodestruction si elle n'est pas dominée"], "type": "emotion"}, {"id": "haine", "title": "Le Noir · La Haine", "subtitle": "La flamme corruptrice", "paras": ["La haine est représentée par des flammes noires qui n'éclairent presque pas. Elles semblent absorber la lumière au lieu de la diffuser, comme si le feu lui-même refusait d'être une source de vie.", "La haine s'enracine. Elle choisit une cible, un nom, un visage, puis transforme toute l'âme en arme tournée vers l'anéantissement."], "facts": ["Couleur : noir profond, fumé, étouffant", "Forme : serpents d'ombre, flammes rampantes", "Effet : corruption de la volonté, fixation destructrice, désir d'anéantir"], "type": "emotion"}, {"id": "obsession", "title": "Le Jaune · L'Obsession", "subtitle": "La flamme qui enchaîne", "paras": ["L' obsession se manifeste par des flammes jaunes, nerveuses et brillantes. Elles reflètent l'esprit de celui qui ne parvient plus à détourner son regard d'un unique but.", "Ce jaune n'a rien de paisible : il est celui de l'idée qui revient sans cesse, du désir qui envahit tout, et de l'objectif qui finit par faire disparaître le monde autour de lui."], "facts": ["Couleur : jaune vif, électrique, hypnotique", "Forme : braises nerveuses, rotation autour d'un centre", "Effet : fixation absolue, enfermement mental, répétition compulsive"], "type": "emotion"}, {"id": "peur", "title": "Le Vert · La Peur", "subtitle": "La flamme qui paralyse", "paras": ["La peur prend la forme de flammes vertes, basses, instables et nerveuses. Elles ondulent comme si elles hésitaient en permanence entre fuir et attaquer.", "Elle peut sauver lorsqu'elle aiguise la vigilance, mais lorsqu'elle déborde, elle coupe les jambes, bloque le souffle et fige le corps dans l'attente du pire."], "facts": ["Couleur : vert malsain, vibrant, inquiet", "Forme : flammes basses, contractées, rétractiles", "Effet : paralysie, doute, hypersensibilité au danger"], "type": "emotion"}, {"id": "desespoir", "title": "Le Violet · Le Désespoir", "subtitle": "La flamme qui vide l'être", "paras": ["Le désespoir se révèle à travers des flammes violettes, longues et silencieuses. Ce n'est plus une douleur qui hurle, mais un effondrement intérieur qui cesse d'attendre l'aube.", "Parmi toutes les émotions, c'est l'une des plus destructrices. Elle n'attaque pas dans la violence ; elle enveloppe, vide et éteint."], "facts": ["Couleur : violet funéraire, crépusculaire", "Forme : voiles et rubans de fumée", "Effet : abandon, vide intérieur, extinction de l'espérance"], "type": "emotion"}, {"id": "flammes", "title": "Les Flammes Émotionnelles", "subtitle": "Le langage des six couleurs", "paras": ["Chaque émotion se matérialise à travers une flamme de couleur distincte . Ces flammes ne sont pas un simple ornement : elles sont l'expression visible d'un état intérieur poussé à son paroxysme. Plus l'émotion est intense, plus la flamme devient dense, haute, instable ou envahissante."], "facts": ["Bleu — Tristesse Consume lentement et alourdit le cœur.", "Rouge — Colère Explose, renforce l'impulsion et brûle vite.", "Noir — Haine Corrompt, absorbe la lumière et déforme la volonté.", "Jaune — Obsession Fixe l'esprit sur un but unique jusqu'à l'enfermement.", "Vert — Peur Paralyse, trouble les sens et accentue les menaces.", "Violet — Désespoir Vide l'être de son espérance et de son élan."], "type": "chapter"}, {"id": "yuu", "title": "Yuu, héritière des Émotions", "subtitle": "L’héritage qui change de sens", "paras": ["Si Gekko fut le créateur de ce pouvoir sanguinaire, Yuu en est désormais l'unique héritière véritable. Là où l'héritage de Gekko se liait avant tout aux émotions sombres, Yuu a franchi une frontière nouvelle : elle seule peut amplifier ces émotions jusqu'à faire naître des porteurs d'émotions positives .", "Cette capacité marque une rupture fondamentale. L'émotion n'est plus seulement une arme tournée vers la souffrance ou la corruption. Entre les mains de Yuu, elle devient aussi une voie de transformation, une possibilité de lumière née d'un feu pourtant conçu pour dévorer."], "facts": [], "type": "chapter"}, {"id": "conclusion", "title": "Le feu du cœur", "subtitle": "Le feu du cœur", "paras": ["Les Émotions ne sont pas un simple pouvoir. Elles sont un langage du cœur devenu flamme , une preuve que l'âme humaine peut brûler autant que la chair.", "La tristesse pleure en bleu. La colère rugit en rouge. La haine dévore en noir. L'obsession enferme en jaune. La peur tremble en vert. Le désespoir s'éteint en violet.", "Et pourtant, au milieu de cet héritage bâti sur la souffrance, une exception demeure : Yuu . Là où Gekko avait enfanté un pouvoir sanguinaire, Yuu est devenue la première à comprendre que ce feu, un jour peut-être, pourrait aussi éclairer."], "facts": [], "type": "chapter"}, {"id": "fin", "type": "back", "title": "Fin du premier tome", "subtitle": "Le feu peut aussi éclairer", "paras": ["Six flammes sombres. Une seule héritière capable d’en révéler une autre destinée.", "— Archives de Yuu Furukawa —"], "facts": []}];
const colors={tristesse:'#4d80ff',colere:'#e34b4b',haine:'#101014',obsession:'#edc33c',peur:'#44ba65',desespoir:'#a16bec'};
const $=id=>document.getElementById(id);let spread=0,busy=false;const small=()=>window.matchMedia('(max-width:750px)').matches;const total=()=>Math.ceil(pages.length/(small()?1:2));
function esc(t){return String(t||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function pageHTML(p,i){if(!p)return '<div class="page-inner"></div>';
 let num='<div class="pagenum">— '+(i+1)+' —</div>';
 if(p.type==='cover')return '<div class="page-inner"><div class="kicker">Archives interdites · Tome I</div><div class="cover-sigil">❦</div><h1>'+esc(p.title)+'</h1><div class="rule"></div><h3>'+esc(p.subtitle)+'</h3><p>Le pouvoir sanguinaire de Gekko,<br>Lune Supérieure 6 de la Banshee.</p><p>Héritage de Yuu, sa fille adoptive.</p><div class="glow-orbs">✦ ✧ ✦</div>'+num+'</div>';
 if(p.type==='back')return '<div class="page-inner"><div class="kicker">Archives scellées</div><div class="cover-sigil">❦</div><h2>'+esc(p.title)+'</h2><h3>'+esc(p.subtitle)+'</h3>'+p.paras.map(t=>'<p>'+esc(t)+'</p>').join('')+num+'</div>';
 let h='<div class="page-inner"><div class="kicker">'+(p.type==='emotion'?'Les six flammes':'Archives des émotions')+'</div><h2>'+esc(p.title)+'</h2><h3>'+esc(p.subtitle)+'</h3>';
 if(p.type==='emotion')h+='<div class="art" data-emotion="'+esc(p.id)+'" style="--aura:'+colors[p.id]+'"><i class="flame"></i><i class="flame"></i><i class="flame"></i><i class="flame"></i></div>';
 h+=p.paras.map((t,n)=>'<p'+(p.id==='preface'&&n===1?' class="vignette"':'')+'>'+esc(t)+'</p>').join('');
 if(p.facts.length)h+='<ul class="facts">'+p.facts.map(t=>'<li>'+esc(t)+'</li>').join('')+'</ul>';
 return h+num+'</div>'}
function render(){spread=Math.min(Math.max(0,spread),total()-1);let index=spread*(small()?1:2);$('left').innerHTML=small()?'':pageHTML(pages[index],index);$('right').innerHTML=pageHTML(pages[index+(small()?0:1)],index+(small()?0:1));for(const el of [$('left'),$('right')])el.classList.remove('cover-page','backcover');const l=pages[index],r=pages[index+(small()?0:1)];if(l?.type==='cover')$('left').classList.add('cover-page');if(r?.type==='cover')$('right').classList.add('cover-page');if(l?.type==='back')$('left').classList.add('backcover');if(r?.type==='back')$('right').classList.add('backcover');$('counter').textContent=(spread+1)+' / '+total();$('prev').disabled=spread===0;$('next').disabled=spread===total()-1}
function turn(dir){if(busy||spread+dir<0||spread+dir>=total())return;busy=true;const overlay=$('turn');overlay.className='turn-overlay '+(dir>0?'next':'prev');void overlay.offsetWidth;overlay.classList.add('active');window.setTimeout(()=>{spread+=dir;render()},390);window.setTimeout(()=>{overlay.classList.remove('active');busy=false},780)}
$('prev').onclick=()=>turn(-1);$('next').onclick=()=>turn(1);document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')turn(1);if(e.key==='ArrowLeft')turn(-1)});let touchX=null;$('book').addEventListener('touchstart',e=>{touchX=e.touches[0].clientX},{passive:true});$('book').addEventListener('touchend',e=>{if(touchX===null)return;let delta=e.changedTouches[0].clientX-touchX;if(Math.abs(delta)>55)turn(delta<0?1:-1);touchX=null},{passive:true});$('contents').onclick=()=>{let lines=pages.map((p,i)=>`${i+1}. ${p.title}`).join('\n');let answer=prompt('Sommaire — entrer un numéro de page :\n\n'+lines,'1');if(answer!==null&&Number.isInteger(+answer)&&+answer>=1&&+answer<=pages.length){spread=Math.floor((+answer-1)/(small()?1:2));render()}};let wasSmall=small();window.addEventListener('resize',()=>{if(wasSmall!==small()){let first=spread*(wasSmall?1:2);wasSmall=small();spread=Math.floor(first/(small()?1:2));render()}});render();
</script></body></html>
